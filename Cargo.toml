[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/auzum197/zcash-disclosure-tools"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("zfuture", "nu7", "nutachyon", "zip233"))'] }

[workspace.dependencies]
zdisclosure-cli = { path = "crates/cli" }
zdisclosure-core = { path = "crates/core" }
zdisclosure-create = { path = "crates/create" }
zdisclosure-fixture = { path = "crates/fixture" }

# One branch of librustzcash for every crate, so their types unify. The revs pin them so
# regenerating the lockfile cannot pick up a moved branch head. Halo2's multicore feature
# cannot build for wasm32, and nothing here proves for real (the tests mock the proofs,
# verification never proves), so it stays off for every target.
zcash_disclosure = { git = "https://github.com/auzum197/librustzcash.git", rev = "65b924f71042203f6db142ec9900ac64b8c9b278" }
zcash_primitives = { git = "https://github.com/auzum197/librustzcash.git", rev = "65b924f71042203f6db142ec9900ac64b8c9b278", default-features = false, features = ["std", "circuits"] }
zcash_protocol = { git = "https://github.com/auzum197/librustzcash.git", rev = "65b924f71042203f6db142ec9900ac64b8c9b278", features = ["local-consensus"] }
zcash_keys = { git = "https://github.com/auzum197/librustzcash.git", rev = "65b924f71042203f6db142ec9900ac64b8c9b278", features = ["sapling"] }
zcash_address = { git = "https://github.com/auzum197/librustzcash.git", rev = "65b924f71042203f6db142ec9900ac64b8c9b278" }
transparent = { package = "zcash_transparent", git = "https://github.com/auzum197/librustzcash.git", rev = "65b924f71042203f6db142ec9900ac64b8c9b278" }

lightwallet-core = { git = "https://github.com/auzum197/lightwallet-tools.git", rev = "780ca8cc02b77fd812495f261bf82b72bfacb279", default-features = false, features = ["canonical", "tls"] }

sapling = { package = "sapling-crypto", version = "0.7", default-features = false, features = ["circuit", "std", "zeroize"] }
zip32 = "0.2"
incrementalmerkletree = { version = "0.8.2", features = ["legacy-api"] }

clap = { version = "4", features = ["derive"] }
hex = "0.4"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
tonic = "0.14"
# The js feature converts through serde-wasm-bindgen, which hands the page a u64 as a
# BigInt. The default json feature goes through JSON.parse and rounds above 2^53.
tsify = { version = "0.5", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
rand_chacha = "0.10"
rand_core = "0.10"

# Copied from librustzcash's root manifest. Patches do not propagate to dependents, and
# without these the build takes crates.io orchard, which lacks Ironwood. The tools handle
# Sapling only, but zcash_disclosure and zcash_primitives still depend on that orchard.
[patch.crates-io]
halo2_gadgets = { git = "https://github.com/zcash/halo2.git", rev = "232496b154e6332c88924e4affa8351ff92408b4" }
halo2_poseidon = { git = "https://github.com/zcash/halo2.git", rev = "232496b154e6332c88924e4affa8351ff92408b4" }
halo2_proofs = { git = "https://github.com/zcash/halo2.git", rev = "232496b154e6332c88924e4affa8351ff92408b4" }
incrementalmerkletree = { git = "https://github.com/zcash/incrementalmerkletree.git", rev = "af3cc3ce54daad90935c657e5d2ded3149c19a1d" }
orchard = { git = "https://github.com/zcash/orchard.git", rev = "3cc0781df0afa3b069bd02264b479e54c74fc3d8" }
sapling-crypto = { git = "https://github.com/zcash/sapling-crypto.git", rev = "cc5353d3590b8defc5c4333d1528bc123b7ab0f8" }
zip32 = { git = "https://github.com/zcash/zip32.git", rev = "0399cd62dae9b3abe5dc8d5e761b8ef11b57b12a" }

# Optimized dependencies, so the cryptography in the end-to-end tests runs fast.
[profile.dev.package."*"]
opt-level = 3
